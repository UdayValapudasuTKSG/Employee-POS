        premiumRateId: { type: ["number", "null"] }
        totalPremium: { type: ["string", "null"] }
        companyPremium: { type: ["string", "null"] }
        employeePremium: { type: ["string", "null"] }
        effectiveDate: { type: ["string", "null"] }
