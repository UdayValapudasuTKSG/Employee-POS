components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    posKey:
      type: http
      scheme: bearer
      description: A brand's POS key (POS_API_KEY_KFC or POS_API_KEY_PIZZA_HUT on the server)
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResult:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    CardEmailResult:
      type: object
      properties:
        ok: { type: boolean }
        maskedDestination:
          type: string
          description: Masked address the card was sent to, safe to display.
      required: [ok, maskedDestination]
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    AssistantAskInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: The employee's question
      required: [message]
    AssistantAnswer:
      type: object
      properties:
        reply: { type: string }
        matched:
          type: boolean
          description: Whether the assistant recognized the question topic
      required: [reply, matched]
    LookupInput:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          description: Email address or phone number
      required: [identifier]
    OtpSelectInput:
      type: object
      properties:
        verificationId: { type: string }
        optionRef:
          type: string
          description: The `ref` of one of the options /v1/otp/verify returned
      required: [verificationId, optionRef]
    OtpResendInput:
      type: object
      properties:
        verificationId: { type: string }
      required: [verificationId]
    LookupOption:
      type: object
      description: Non-identifying disambiguation option
      properties:
        ref: { type: string }
        label:
          type: string
          description: e.g. "J•••• D••••, born 19••-04"
      required: [ref, label]
    LookupResult:
      type: object
      description: >
        Uniform shape whether or not a match exists. `lookupRef` and `options`
        are always null now that record selection happens after verification;
        they stay in the shape so the body never changes.
      properties:
        status:
          type: string
          enum: [CODE_SENT]
        message: { type: string }
        verificationId: { type: ["string", "null"] }
        maskedDestination: { type: ["string", "null"] }
        lookupRef: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/LookupOption"
        devCode:
          type: ["string", "null"]
          description: Plain OTP, only present when dev mode is on
      required: [status, message, verificationId, maskedDestination, lookupRef, options, devCode]
    OtpVerifyInput:
      type: object
      properties:
        verificationId: { type: string }
        code:
          type: string
          minLength: 6
          maxLength: 6
      required: [verificationId, code]
    OtpVerifyResult:
      type: object
      description: >
        CARD carries the card session (cardToken, expiresAt, confirm). SELECT
        carries `options` to pass to /v1/otp/select. MULTI_COMPANY carries only
        `message`, which names no company.
      properties:
        status:
          type: string
          enum: [CARD, SELECT, MULTI_COMPANY]
        cardToken: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        confirm:
          oneOf:
            - $ref: "#/components/schemas/ConfirmInfo"
            - type: "null"
        options:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/LookupOption"
        message: { type: ["string", "null"] }
      required: [status, cardToken, expiresAt, confirm, options, message]
    ConfirmInfo:
      type: object
      description: Minimal confirmation info shown after verification
      properties:
        firstName: { type: string }
        maskedIdentifier: { type: string }
        companyName: { type: string }
      required: [firstName, maskedIdentifier, companyName]
    CardDependent:
      type: object
      properties:
        id:
          type: string
          description: >
            The BHI DependentID, as a string. Needed so the member can name this
            dependant in an RFM.
        fullName:
          type: string
          description: DependentFullName — the BHI model keeps one name field
        relationship: { type: string }
        dateOfBirth: { type: ["string", "null"] }
      required: [id, fullName, relationship, dateOfBirth]
    CardBeneficiary:
      type: object
      properties:
        fullName:
          type: string
          description: BeneficiaryFullName — the BHI model keeps one name field
        relationship:
          type: ["string", "null"]
          description: >
            Null for a beneficiary loaded from the carrier's Beneficiaries
            sheet, which has no Relationship column.
        allocationPercent: { type: ["number", "null"] }
      required: [fullName, relationship, allocationPercent]
    CardIssuer:
      type: object
      description: >
        Who issued the card, as the deployment is configured (ISSUER_* in the
        API environment). Every field may be absent; the card renders what it
        is given and omits the rest rather than showing another insurer's
        details.
      properties:
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        signatoryName: { type: ["string", "null"] }
        signatoryTitle: { type: ["string", "null"] }
        planTitle: { type: string }
        propertyNotice: { type: ["string", "null"] }
      required:
        [address, phone, signatoryName, signatoryTitle, planTitle, propertyNotice]
    CardPayload:
      type: object
      properties:
        insurerName: { type: string }
        planName: { type: string }
        policyholder: { type: string }
        policyNumber: { type: string }
        groupNumber: { type: string }
        memberId: { type: string }
        certificateNumber: { type: string }
        employeeName: { type: string }
        identificationId: { type: string }
        idType:
          type: string
          description: The member's ID type (e.g. NATIONAL ID, PASSPORT, E-ID); labels the ID number on the card
        classCode: { type: string }
        dateOfBirth: { type: ["string", "null"] }
        effectiveDate: { type: string }
        expiryDate: { type: ["string", "null"] }
        companyName: { type: string }
        dependents:
          type: array
          items:
            $ref: "#/components/schemas/CardDependent"
        beneficiaries:
          type: array
          items:
            $ref: "#/components/schemas/CardBeneficiary"
        issuer:
          $ref: "#/components/schemas/CardIssuer"
        backNotice: { type: string }
        sessionExpiresAt: { type: string }
      required:
        [insurerName, planName, policyholder, policyNumber, groupNumber, memberId,
         certificateNumber, employeeName, identificationId, idType, classCode, dateOfBirth,
         effectiveDate, expiryDate, companyName, dependents, beneficiaries, issuer, backNotice,
         sessionExpiresAt]
    AdminLoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]
    AdminLoginResult:
      type: object
      properties:
        token: { type: string }
        role: { type: string }
        scope:
          type: ["string", "null"]
          description: Company code, or null for all companies
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string }
        mustChangePassword:
          type: boolean
          description: When true, the admin must change their temporary password before using the portal
      required: [token, role, scope, displayName, permissions, mustChangePassword]
    AdminMe:
      type: object
      properties:
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        roleLabel:
          type: string
          description: e.g. "Super admin" for ROLE_PLATFORM_ADMIN
        scope:
          type: ["string", "null"]
          description: The one company of an HR administrator or client admin; null otherwise
        scopeCompanyName: { type: ["string", "null"] }
        companies:
          type: ["array", "null"]
          description: The company numbers this admin reaches, or null for every company
          items: { type: string }
        readOnly:
          type: boolean
          description: True for support and auditor, which may read every company but change nothing
        permissions:
          type: array
          items: { type: string }
      required:
        [email, displayName, role, roleLabel, scope, scopeCompanyName,
         companies, readOnly, permissions]
    Company:
      type: object
      properties:
        companyNumber: { type: string }
        companyName: { type: string }
        active: { type: boolean }
        address1: { type: ["string", "null"] }
        address2: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        activeMembers: { type: number }
        inactiveMembers: { type: number }
      required: [companyNumber, companyName, active, address1, address2, city, contactName, contactPhone, contactEmail, notes, activeMembers, inactiveMembers]
    DashboardStats:
      type: object
      properties:
        totalMembers:
          type: number
          description: Every member in the scope, active or not
        activeMembers: { type: number }
        inactiveMembers:
          type: number
          description: >
            Members with Active = false — deactivated by an administrator or aged
            out at 65. Their records are retained.
        totalDependents:
          type: number
          description: Active dependants of active members
        expiredPolicyCount: { type: number }
        membersWithoutDateOfBirth:
          type: number
          description: >
            Active members with no date of birth. Cover ends at 65, so these can
            never be retired and are billed until someone adds one. New members
            cannot be created without it.
        verificationsToday: { type: number }
        lockedVerifications: { type: number }
        openLookupAlerts:
          type: ["number", "null"]
          description: >
            Open multi-company lookup alerts. Sent to super admins only; null
            for every other role.
        openImportExceptions:
          type: number
          description: Records held by bulk import or the migration, not yet fixed, across the scope.
        draftBillingRuns:
          type: ["number", "null"]
          description: Draft (not yet final) billing runs in scope. Null without BILLING_READ.
        unpricedMembers:
          type: ["number", "null"]
          description: Members without a rate in the latest draft runs in scope. Null without BILLING_READ.
        recentAudit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        byCompany:
          type: array
          items:
            $ref: "#/components/schemas/CompanyCount"
      required:
        [totalMembers, activeMembers, inactiveMembers, totalDependents,
         expiredPolicyCount, membersWithoutDateOfBirth, verificationsToday, lockedVerifications,
         openLookupAlerts, openImportExceptions, draftBillingRuns, unpricedMembers,
         recentAudit, byCompany]
    CompanyCount:
      type: object
      properties:
        companyNumber: { type: string }
        companyName: { type: string }
        memberCount: { type: number }
        activeCount: { type: number }
      required: [companyNumber, companyName, memberCount, activeCount]
    MemberSummary:
      type: object
      properties:
        memberId: { type: number }
        companyNumber: { type: string }
        companyName: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        classCode: { type: string }
        email:
          type: ["string", "null"]
          description: Masked for roles without CONTACT_UNMASK
        phone: { type: ["string", "null"] }
        active: { type: boolean }
        activeDependentCount: { type: number }
        policyStatus:
          type: string
          enum: [ON_FILE, EXPIRED, NONE]
          description: >
            ON_FILE — a policy that has not expired; EXPIRED — only policies past
            their expiry date; NONE — no policy, so the member's card lookup
            finds no active policy.
      required:
        [memberId, companyNumber, companyName, idType, idNumber, firstName,
         lastName, classCode, email, phone, active, activeDependentCount, policyStatus]
    MemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberSummary"
        page: { type: number }
        pageSize: { type: number }
        totalItems: { type: number }
        totalPages: { type: number }
      required: [items, page, pageSize, totalItems, totalPages]
    Dependent:
      type: object
      properties:
        dependentId: { type: number }
        fullName: { type: string }
        relationship: { type: string }
        dateOfBirth: { type: ["string", "null"] }
        idType: { type: ["string", "null"] }
        idNumber: { type: ["string", "null"] }
        sex: { type: ["string", "null"] }
        active: { type: boolean }
        inactiveDate: { type: ["string", "null"] }
        inactiveReason: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required:
        [dependentId, fullName, relationship, dateOfBirth, idType, idNumber, sex,
         active, inactiveDate, inactiveReason, notes]
    Beneficiary:
      type: object
      properties:
        beneficiaryId: { type: number }
        fullName: { type: string }
        relationship:
          type: ["string", "null"]
          description: >
            Null for a beneficiary loaded from the carrier's Beneficiaries
            sheet, which has no Relationship column.
        dateOfBirth: { type: ["string", "null"] }
        idType: { type: ["string", "null"] }
        idNumber: { type: ["string", "null"] }
        sex: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        sharePercent: { type: ["number", "null"] }
        active: { type: boolean }
        inactiveDate: { type: ["string", "null"] }
        inactiveReason: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required:
        [beneficiaryId, fullName, relationship, dateOfBirth, idType, idNumber,
         sex, phone, email, sharePercent, active, inactiveDate, inactiveReason,
         notes]
    BeneficiaryCreate:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        relationship:
          type: ["string", "null"]
          enum: [SPOUSE, CHILD, PARENT, SIBLING, ESTATE, OTHER, null]
        dateOfBirth: { type: ["string", "null"] }
        idType:
          oneOf:
            - $ref: "#/components/schemas/IdType"
            - type: "null"
        idNumber: { type: ["string", "null"], maxLength: 40 }
        sex: { type: ["string", "null"], maxLength: 10 }
        phone: { type: ["string", "null"], maxLength: 50 }
        email: { type: ["string", "null"], maxLength: 100 }
        sharePercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        notes: { type: ["string", "null"] }
        reason:
          type: string
          minLength: 3
      required: [fullName, reason]
    BeneficiaryUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        relationship:
          type: ["string", "null"]
          enum: [SPOUSE, CHILD, PARENT, SIBLING, ESTATE, OTHER, null]
        dateOfBirth: { type: ["string", "null"] }
        idType:
          oneOf:
            - $ref: "#/components/schemas/IdType"
            - type: "null"
        idNumber: { type: ["string", "null"], maxLength: 40 }
        sex: { type: ["string", "null"], maxLength: 10 }
        phone: { type: ["string", "null"], maxLength: 50 }
        email: { type: ["string", "null"], maxLength: 100 }
        sharePercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        notes: { type: ["string", "null"] }
        reason:
          type: string
          minLength: 3
      required: [reason]
    Policy:
      type: object
      properties:
        policyholder: { type: string }
        policyNumber: { type: string }
        groupNumber: { type: string }
        memberId: { type: string }
        certificateNumber: { type: string }
        planName: { type: string }
        effectiveDate: { type: string }
        expiryDate: { type: ["string", "null"] }
        insurerName: { type: string }
      required:
        [policyholder, policyNumber, groupNumber, memberId, certificateNumber,
         planName, effectiveDate, expiryDate, insurerName]
    BillingTier:
      type: object
      description: >
        The premium tier a member's active dependants put them in (spec FR-022):
        0 Employee only, 1 +1, 2 +2, 3 more than two.
      properties:
        dependentBand: { type: number }
        coverageBand: { type: string }
        coverageLabel: { type: string }
      required: [dependentBand, coverageBand, coverageLabel]
    MemberDetail:
      type: object
      properties:
        memberId: { type: number }
        companyNumber: { type: string }
        companyName: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        middleInitials: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        sex: { type: ["string", "null"] }
        classCode: { type: string }
        className: { type: string }
        addressLine1: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        employmentDate: { type: ["string", "null"] }
        planDate: { type: ["string", "null"] }
        rateOfPay:
          type: ["string", "null"]
          description: Money (15,2), as a decimal string so no cent is lost
        occupation: { type: ["string", "null"] }
        active:
          type: boolean
          description: The BHI Active flag — the only member status (spec FR-038)
        inactiveDate: { type: ["string", "null"] }
        inactiveReason: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        activeDependentCount: { type: number }
        currentTier:
          $ref: "#/components/schemas/BillingTier"
        sharedContactAlert:
          type: boolean
          description: >
            True when an open multi-company lookup alert involves this member.
            Company-scoped users see only this flag, never the other company.
        policy:
          oneOf:
            - $ref: "#/components/schemas/Policy"
            - type: "null"
        dependents:
          type: array
          items:
            $ref: "#/components/schemas/Dependent"
        beneficiaries:
          type: array
          items:
            $ref: "#/components/schemas/Beneficiary"
        createdAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
      required:
        [memberId, companyNumber, companyName, idType, idNumber, firstName,
         lastName, middleInitials, dateOfBirth, sex, classCode, className,
         addressLine1, addressLine2, email, phone, employmentDate, planDate,
         rateOfPay, occupation, active, inactiveDate, inactiveReason, notes,
         activeDependentCount, currentTier, sharedContactAlert, policy,
         dependents, beneficiaries, createdAt, updatedAt]
    MemberFields:
      type: object
      description: The editable BHI Member fields, with the Access file's sizes.
      properties:
        idType:
          $ref: "#/components/schemas/IdType"
        idNumber: { type: string, minLength: 1, maxLength: 40 }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        middleInitials: { type: ["string", "null"], maxLength: 20 }
        dateOfBirth:
          type: ["string", "null"]
          description: >
            YYYY-MM-DD, or any format the member importer accepts. Required for
            a new member (cover ends at 65); once recorded it can be corrected
            but not cleared.
        sex: { type: ["string", "null"], maxLength: 10 }
        classCode:
          type: string
          minLength: 1
          maxLength: 1
          description: Must be an active class with its four tier rates in place
        addressLine1: { type: ["string", "null"], maxLength: 150 }
        addressLine2: { type: ["string", "null"], maxLength: 150 }
        email: { type: ["string", "null"], maxLength: 100 }
        phone: { type: ["string", "null"], maxLength: 50 }
        employmentDate: { type: ["string", "null"] }
        planDate: { type: ["string", "null"] }
        rateOfPay:
          type: ["string", "null"]
          description: Decimal string, up to 13 digits and 2 decimals
        occupation: { type: ["string", "null"], maxLength: 100 }
        notes: { type: ["string", "null"] }
    MemberUpdate:
      description: >
        Any MemberFields to change, plus a reason. Whether the member is active
        is changed only by /deactivate and /reactivate, so every status change
        has a reason and a history row.
      allOf:
        - $ref: "#/components/schemas/MemberFields"
        - type: object
          properties:
            reason:
              type: string
              minLength: 3
          required: [reason]
    MemberCreate:
      description: A hand-created member of the company in the path.
      allOf:
        - $ref: "#/components/schemas/MemberFields"
        - type: object
          properties:
            dependants:
              type: array
              description: >
                Dependants to create alongside the member, in the same
                transaction: if any is rejected, the member is not created
                either.
              items:
                $ref: "#/components/schemas/MemberCreateDependant"
            reason:
              type: string
              minLength: 3
          required: [idType, idNumber, firstName, lastName, classCode, dateOfBirth, reason]
    MemberCreateDependant:
      type: object
      description: One dependant supplied while creating a member.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        relationship:
          $ref: "#/components/schemas/DependentRelationship"
        dateOfBirth:
          type: ["string", "null"]
          description: YYYY-MM-DD, or any format the member importer accepts
        idType:
          oneOf:
            - $ref: "#/components/schemas/IdType"
            - type: "null"
        idNumber: { type: ["string", "null"], maxLength: 40 }
        sex: { type: ["string", "null"], maxLength: 10 }
      required: [fullName, relationship]
    DeactivateInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
        effectiveDate:
          type: ["string", "null"]
          description: InactiveDate, YYYY-MM-DD; defaults to today in Guyana
      required: [reason]
    MemberPolicyInput:
      type: object
      description: >
        Creates the member's policy if absent, otherwise replaces it. Without a
        policy a member passes verification but cannot be shown a card.
      properties:
        policyholder: { type: string, minLength: 1 }
        policyNumber: { type: string, minLength: 1 }
        groupNumber: { type: string, minLength: 1 }
        memberNumber: { type: string, minLength: 1 }
        certificateNumber: { type: string, minLength: 1 }
        planName: { type: string, minLength: 1 }
        insurerName: { type: string, minLength: 1 }
        effectiveDate: { type: string, minLength: 1 }
        expiryDate: { type: ["string", "null"] }
        reason:
          type: string
          minLength: 3
      required:
        [policyholder, policyNumber, groupNumber, memberNumber,
         certificateNumber, planName, insurerName, effectiveDate, expiryDate,
         reason]
    VerificationUnlockResult:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        attempts: { type: number }
        expiresAt: { type: string }
        message:
          type: string
          description: What to tell the member, since no new code is sent
      required: [id, status, attempts, expiresAt, message]
    DependentCreate:
      type: object
      description: A new dependant of the member, plus a reason. It starts active.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        relationship:
          $ref: "#/components/schemas/DependentRelationship"
        dateOfBirth: { type: ["string", "null"] }
        idType:
          oneOf:
            - $ref: "#/components/schemas/IdType"
            - type: "null"
        idNumber: { type: ["string", "null"], maxLength: 40 }
        sex: { type: ["string", "null"], maxLength: 10 }
        notes: { type: ["string", "null"] }
        reason:
          type: string
          minLength: 3
      required: [fullName, relationship, reason]
    DependentUpdate:
      type: object
      description: >
        Fields to change, plus a reason. Whether the dependant is active is
        changed only by /deactivate and /reactivate.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        relationship:
          $ref: "#/components/schemas/DependentRelationship"
        dateOfBirth: { type: ["string", "null"] }
        idType:
          oneOf:
            - $ref: "#/components/schemas/IdType"
            - type: "null"
        idNumber: { type: ["string", "null"], maxLength: 40 }
        sex: { type: ["string", "null"], maxLength: 10 }
        notes: { type: ["string", "null"] }
        reason:
          type: string
          minLength: 3
      required: [reason]
    ReasonInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required: [reason]
    DependentRelationship:
      type: string
      description: >
        The Access database's DependentRelationship list, which prints on the
        card face. What an admin or employee may choose; a dependant stored
        before this list (CHILD, FATHER, MOTHER, BROTHER, SISTER) keeps its value
        until it is edited, so responses carry relationship as a plain string.
      enum: [SPOUSE, SON, DAUGHTER, OTHER]
    IdType:
      type: string
      description: >
        The Access database's IDType list (National ID, Passport, E-ID), stored
        upper-case exactly as the carrier import writes it, so a member entered
        by hand and the same member in a later import match. Required of what an
        admin enters; records loaded earlier may hold other values, and responses
        carry idType as a plain string.
      enum: ["NATIONAL ID", PASSPORT, E-ID]
    ChangeRequestDocumentType:
      type: string
      enum:
        - NATIONAL_ID
        - DRIVERS_LICENCE
        - PASSPORT
        - BIRTH_CERTIFICATE
        - MARRIAGE_CERTIFICATE
        - OTHER
    ChangeRequestDocumentInput:
      type: object
      description: >
        The supporting proof, sent inline as base64 so the request and its
        document commit in one transaction. Max 5 MB decoded; PDF, JPEG and PNG
        only, verified against the file's magic bytes rather than this
        declaration.
      properties:
        documentType:
          $ref: "#/components/schemas/ChangeRequestDocumentType"
        fileName: { type: string, minLength: 1 }
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        contentBase64: { type: string, minLength: 1 }
      required: [documentType, fileName, mimeType, contentBase64]
    ChangeRequestCreate:
      type: object
      description: >
        Set `dependentId` to correct a dependant, or leave it null to correct
        your own record. At least one requested field must be present and must
        differ from the current value. A dependant has one full-name field, so
        for a dependant the requested first and last names are joined into it.
      properties:
        dependentId:
          type: ["string", "null"]
          description: >
            One of the member's own dependants (the card's CardDependent.id), or
            null for the member
        requestedFirstName: { type: ["string", "null"] }
        requestedLastName: { type: ["string", "null"] }
        requestedDateOfBirth: { type: ["string", "null"] }
        requestedRelationship:
          oneOf:
            - $ref: "#/components/schemas/DependentRelationship"
            - type: "null"
          description: Dependants only; ignored for a member subject
        employeeNote: { type: ["string", "null"] }
        document:
          $ref: "#/components/schemas/ChangeRequestDocumentInput"
      required:
        [dependentId, requestedFirstName, requestedLastName,
         requestedDateOfBirth, requestedRelationship, employeeNote, document]
    OwnChangeRequest:
      type: object
      description: >
        The member's view of their own request. Deliberately omits the
        reviewer's identity.
      properties:
        id: { type: string }
        subjectType:
          type: string
          enum: [MEMBER, DEPENDENT]
        subjectName: { type: string }
        requestedFirstName: { type: ["string", "null"] }
        requestedLastName: { type: ["string", "null"] }
        requestedDateOfBirth: { type: ["string", "null"] }
        requestedRelationship: { type: ["string", "null"] }
        employeeNote: { type: ["string", "null"] }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reviewNote: { type: ["string", "null"] }
        documentFileName: { type: ["string", "null"] }
        createdAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
      required:
        [id, subjectType, subjectName, requestedFirstName, requestedLastName,
         requestedDateOfBirth, requestedRelationship, employeeNote, status,
         reviewNote, documentFileName, createdAt, reviewedAt]
    DiscountBrand:
      type: string
      enum: [KFC, PIZZA_HUT]
    DiscountBrandInfo:
      type: object
      properties:
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        name: { type: string }
      required: [brand, name]
    OwnDiscountCoupon:
      type: object
      description: >
        A coupon as its member sees it. The code is never included — it is
        returned once, when generated, and stored only as a hash.
      properties:
        id: { type: string }
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        status:
          type: string
          description: EXPIRED is an ACTIVE coupon past expiresAt.
          enum: [ACTIVE, EXPIRED, REDEEMED, VOIDED, CANCELLED]
        discountPercent: { type: number }
        createdAt: { type: string }
        expiresAt: { type: string }
        redeemedAt: { type: ["string", "null"] }
        billAmount: { type: ["number", "null"] }
        discountAmount: { type: ["number", "null"] }
      required:
        [id, brand, status, discountPercent, createdAt, expiresAt, redeemedAt,
         billAmount, discountAmount]
    OwnDiscountCouponPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OwnDiscountCoupon" }
        page: { type: number }
        pageSize: { type: number }
        totalItems: { type: number }
        totalPages: { type: number }
      required: [items, page, pageSize, totalItems, totalPages]
    DiscountSummary:
      type: object
      properties:
        discountPercent: { type: number }
        currency: { type: string, description: Always GYD }
        monthlyCap: { type: number, description: "The most discount a member can receive in a month, all brands together" }
        month: { type: string, description: "The current month in Guyana time, YYYY-MM" }
        usedThisMonth: { type: number }
        remainingThisMonth: { type: number }
        couponTtlMinutes: { type: number }
        brands:
          type: array
          items: { $ref: "#/components/schemas/DiscountBrandInfo" }
        coupons:
          type: array
          description: The member's 20 most recent coupons, newest first
          items: { $ref: "#/components/schemas/OwnDiscountCoupon" }
      required:
        [discountPercent, currency, monthlyCap, month, usedThisMonth,
         remainingThisMonth, couponTtlMinutes, brands, coupons]
    GenerateCouponInput:
      type: object
      properties:
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        challengeId: { type: string, description: "From POST /v1/discounts/coupons/otp" }
        code: { type: string, pattern: '^[0-9]{6}$', description: "The 6-digit code sent to the member" }
      required: [brand, challengeId, code]
    CouponOtpInput:
      type: object
      properties:
        brand: { $ref: "#/components/schemas/DiscountBrand" }
      required: [brand]
    CouponOtpChallenge:
      type: object
      properties:
        challengeId: { type: string }
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        maskedDestination: { type: string, description: "Where the code went, masked" }
        expiresAt: { type: string }
        resendAfterSeconds: { type: number }
        devCode:
          type: ["string", "null"]
          description: The code itself, only when the server runs in OTP dev mode
      required: [challengeId, brand, maskedDestination, expiresAt, resendAfterSeconds, devCode]
    GeneratedCoupon:
      type: object
      properties:
        code:
          type: string
          description: "What the QR code encodes, e.g. K7PQ-3MZX-9TRA. Shown once."
        coupon: { $ref: "#/components/schemas/OwnDiscountCoupon" }
        remainingThisMonth: { type: number }
        emailedTo:
          type: ["string", "null"]
          description: >
            The masked address a copy of the coupon (code and QR) was emailed
            to, or null when no copy was sent: no address on file, email not
            configured, or the send failed. The coupon is valid either way.
      required: [code, coupon, remainingThisMonth, emailedTo]
    PosCheckInput:
      type: object
      properties:
        code: { type: string, minLength: 1, maxLength: 64, description: "As scanned; hyphens, spaces and case are ignored" }
        billAmount: { type: number, exclusiveMinimum: 0, maximum: 100000000, description: "GYD, before discount" }
      required: [code]
    PosQuote:
      type: object
      properties:
        billAmount: { type: number }
        fullDiscountAmount: { type: number, description: "What the percentage alone would give" }
        discountAmount: { type: number, description: "What would actually be given: less than fullDiscountAmount when capApplied" }
        amountPayable: { type: number }
        capApplied:
          type: boolean
          description: >
            True when the remaining allowance, not the percentage, sets the
            discount. Redeem then needs confirmPartialDiscount: true.
        message: { type: string, description: "The line to show the cashier; asks for confirmation when capApplied" }
      required: [billAmount, fullDiscountAmount, discountAmount, amountPayable, capApplied, message]
    PosCheckResult:
      type: object
      properties:
        couponId: { type: string }
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        discountPercent: { type: number }
        expiresAt: { type: string }
        remainingAllowance: { type: number }
        quote:
          oneOf:
            - $ref: "#/components/schemas/PosQuote"
            - type: "null"
      required: [couponId, brand, discountPercent, expiresAt, remainingAllowance, quote]
    PosRedeemInput:
      type: object
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        billAmount: { type: number, exclusiveMinimum: 0, maximum: 100000000, description: "GYD, before discount" }
        posReference: { type: string, minLength: 1, maxLength: 100, description: "The till's receipt or order number" }
        posStore: { type: string, maxLength: 100, description: "Store or till identifier" }
        confirmPartialDiscount:
          type: boolean
          description: >
            The cashier agreed to apply less than the full percentage because
            the employee's allowance cannot cover it. Without it such a
            redemption is refused with PARTIAL_DISCOUNT_NOT_CONFIRMED and
            nothing is recorded.
      required: [code, billAmount, posReference]
    PosRedemption:
      type: object
      properties:
        couponId: { type: string }
        brand: { $ref: "#/components/schemas/DiscountBrand" }
        discountPercent: { type: number }
        billAmount: { type: number }
        fullDiscountAmount: { type: number, description: "What the percentage alone would have given" }
        discountAmount: { type: number }
        amountPayable: { type: number }
        capApplied: { type: boolean }
        posReference: { type: string }
        redeemedAt: { type: string }
        remainingAllowance: { type: number, description: "The member's allowance left this month after this redemption" }
      required:
        [couponId, brand, discountPercent, billAmount, fullDiscountAmount, discountAmount,
         amountPayable, capApplied, posReference, redeemedAt, remainingAllowance]
    PosVoidInput:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
      required: [reason]
    PosVoidResult:
      type: object
      properties:
        couponId: { type: string }
        status: { type: string, enum: [VOIDED] }
        voidedAt: { type: string }
      required: [couponId, status, voidedAt]
    ChangeRequestFieldChange:
      type: object
      properties:
        field:
          type: string
          description: fullName applies to a dependant, whose name is one field
          enum: [firstName, lastName, fullName, dateOfBirth, relationship]
        current: { type: ["string", "null"] }
        requested: { type: string }
      required: [field, current, requested]
    ChangeRequestSummary:
      type: object
      properties:
        id: { type: string }
        memberId: { type: number }
        memberName: { type: string }
        companyNumber: { type: string }
        companyName: { type: string }
        subjectType:
          type: string
          enum: [MEMBER, DEPENDENT]
        subjectName: { type: string }
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequestFieldChange"
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        hasDocument: { type: boolean }
        createdAt: { type: string }
        reviewedAt:
          type: ["string", "null"]
          description: When the request was approved or rejected; null while pending.
        reviewer:
          description: >
            Who approved or rejected the request. Sent only to super admins,
            who oversee every company's reviewers; null for every other role
            and while the request is pending.
          oneOf:
            - $ref: "#/components/schemas/ChangeRequestReviewer"
            - type: "null"
      required:
        [id, memberId, memberName, companyNumber, companyName,
         subjectType, subjectName, changes, status, hasDocument, createdAt]
    ChangeRequestReviewer:
      type: object
      properties:
        email: { type: string }
        name:
          type: string
          description: The admin's display name, or their email if the account no longer exists.
        role:
          type: ["string", "null"]
          description: The admin's current role, e.g. ROLE_HR_ADMIN; null if the account no longer exists.
      required: [email, name, role]
    ChangeRequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequestSummary"
        page: { type: number }
        pageSize: { type: number }
        totalItems: { type: number }
        totalPages: { type: number }
      required: [items, page, pageSize, totalItems, totalPages]
    ChangeRequestDocumentMeta:
      type: object
      properties:
        id: { type: string }
        documentType: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        byteSize: { type: number }
        sha256: { type: string }
        purged: { type: boolean }
      required: [id, documentType, fileName, mimeType, byteSize, sha256, purged]
    ChangeRequestDocumentContent:
      type: object
      properties:
        fileName: { type: string }
        mimeType:
          type: string
          description: Sniffed on upload; use this for the Blob type
        byteSize: { type: number }
        contentBase64: { type: string }
      required: [fileName, mimeType, byteSize, contentBase64]
    ChangeRequestDetail:
      type: object
      properties:
        id: { type: string }
        memberId: { type: number }
        memberName: { type: string }
        companyNumber: { type: string }
        companyName: { type: string }
        subjectType:
          type: string
          enum: [MEMBER, DEPENDENT]
        subjectName: { type: string }
        dependentId: { type: ["number", "null"] }
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequestFieldChange"
        employeeNote: { type: ["string", "null"] }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reviewedBy: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"] }
        reviewNote: { type: ["string", "null"] }
        document:
          oneOf:
            - $ref: "#/components/schemas/ChangeRequestDocumentMeta"
            - type: "null"
        createdAt: { type: string }
      required:
        [id, memberId, memberName, companyNumber, companyName,
         subjectType, subjectName, dependentId, changes, employeeNote, status,
         reviewedBy, reviewedAt, reviewNote, document, createdAt]
    ChangeRequestDecision:
      type: object
      properties:
        note:
          type: string
          minLength: 3
          description: Recorded on the request and reused as the audit reason
      required: [note]
    ImportInput:
      type: object
      description: >
        Supply exactly one of `sheets`, `rows` or `csvText`. Only the carrier
        layouts are accepted — Members, Dependants and Beneficiaries — detected
        from each header row. The old 8-column members layout is withdrawn and
        returns 400 LAYOUT_WITHDRAWN. GET /v1/admin/import/layouts lists them.
      properties:
        csvText:
          type: string
          description: Raw CSV text. Ignored when `rows` is present.
        rows:
          type: array
          description: >
            A single pre-parsed sheet, row 0 being the header. Retained for
            single-sheet uploads; prefer `sheets` for a workbook.
          items:
            type: array
            items: { type: string }
        sheets:
          type: array
          description: >
            Every sheet of an uploaded workbook. Members are committed first, so
            a dependant or beneficiary can reference a member created by the
            same import.
          items:
            $ref: "#/components/schemas/ImportSheet"
        fileName:
          type: string
          description: >
            The uploaded file's name, kept on the import batch. The batch's
            source file name is generated by the server.
        dryRun: { type: boolean }
        confirmUpdates:
          type: boolean
          description: >
            Required (true) to commit a file in which some rows match records
            already on file and would update them; otherwise the commit answers
            409 UPDATES_NOT_CONFIRMED. Ignored on a dry run.
        layout:
          type: string
          enum: [CARRIER, DEPENDANT, BENEFICIARY]
          description: >
            Read only the sheets in this layout and ignore the rest of the
            workbook (the Import screen's Members, Dependants and Beneficiaries
            tabs). 400 BAD_HEADER when no sheet is in it. Omitted, every
            recognised sheet is read.
      required: [dryRun]
    ImportSheet:
      type: object
      properties:
        name:
          type: string
          description: The worksheet name, echoed back in the result for context
        rows:
          type: array
          description: Row 0 is the header. Cells are strings; dates must be YYYY-MM-DD.
          items:
            type: array
            items: { type: string }
      required: [name, rows]
    ImportLayoutDescriptor:
      type: object
      properties:
        layout:
          type: string
          enum: [CARRIER, DEPENDANT, BENEFICIARY]
        label:
          type: string
          description: What to call this sheet on screen, e.g. "Beneficiaries".
        columns:
          type: array
          description: >
            The header row this layout expects, in template order. A column may
            appear twice — the Beneficiaries sheet carries LastName and
            FirstName once for the member and once for the beneficiary.
          items: { type: string }
        description: { type: string }
      required: [layout, label, columns, description]
    ImportLayoutList:
      type: object
      properties:
        layouts:
          type: array
          items:
            $ref: "#/components/schemas/ImportLayoutDescriptor"
      required: [layouts]
    ImportSheetResult:
      type: object
      properties:
        name: { type: string }
        layout:
          type: string
          enum: [CARRIER, DEPENDANT, BENEFICIARY]
        totalRows: { type: number }
        okCount: { type: number }
        warnCount: { type: number }
        errorCount: { type: number }
        duplicateCount: { type: number }
        invalidPhoneCount: { type: number }
        heldCount:
          type: number
          description: Error rows that are (or, on a dry run, would be) held in the company's fix list.
        existingCount:
          type: number
          description: Rows of this sheet matching records already in the system.
        committedCount: { type: number }
        message: { type: ["string", "null"] }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowResult"
      required:
        [name, layout, totalRows, okCount, warnCount, errorCount,
         duplicateCount, invalidPhoneCount, heldCount, existingCount, committedCount, message, rows]
    ImportRowResult:
      type: object
      properties:
        rowNumber: { type: number }
        status:
          type: string
          enum: [OK, WARN, ERROR]
        message: { type: string }
        companyNumber: { type: ["string", "null"] }
        idNumber:
          type: ["string", "null"]
          description: The member's ID number (for a dependant or beneficiary row, its member's).
        name: { type: ["string", "null"] }
        reasonCodes:
          type: array
          description: >
            Why an ERROR row cannot be loaded — e.g. MISSING_ID_TYPE,
            MISSING_CLASS, VALUE_TOO_LONG, UNKNOWN_CLASS, ID_ALREADY_REGISTERED.
            Empty for OK and WARN rows.
          items: { type: string }
        duplicate:
          type: boolean
          description: >
            True when the row repeats an earlier row of the file, or its ID is
            already registered to a member of another company. A subset of the
            ERROR rows.
        invalidPhone:
          type: boolean
          description: True when the row was rejected only for an undeliverable member phone number.
        held:
          type: boolean
          description: >
            True when the ERROR row is (or would be) written to the company's
            import exceptions for HR to fix and upload again.
        existingRecord:
          type: boolean
          description: The row matches a member, dependant or beneficiary already in the system and updates it.
        changedFields:
          type: array
          description: For an existing member, the columns the row would change; empty when it matches the record.
          items: { type: string }
        recordType:
          type: string
          enum: [MEMBER, DEPENDENT, BENEFICIARY]
        resolvesExceptionId:
          type: ["number", "null"]
          description: The open import exception this row fixes, if any.
      required:
        [rowNumber, status, message, companyNumber, idNumber, name, reasonCodes,
         duplicate, invalidPhone, held, existingRecord, changedFields, recordType,
         resolvesExceptionId]
    ImportResolvedException:
      type: object
      properties:
        exceptionId: { type: number }
        companyNumber: { type: string }
        memberId: { type: number }
        personName: { type: ["string", "null"] }
        restoredDependents: { type: number }
        restoredBeneficiaries: { type: number }
      required:
        [exceptionId, companyNumber, memberId, personName, restoredDependents,
         restoredBeneficiaries]
    ImportBatchSummary:
      type: object
      properties:
        companyNumber: { type: string }
        sourceFile: { type: ["string", "null"] }
        saved:
          type: boolean
          description: False when a write failed and nothing for this company was saved.
        message: { type: ["string", "null"] }
      required: [companyNumber, sourceFile, saved, message]
    ImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        layout:
          type: string
          enum: [CARRIER, DEPENDANT, BENEFICIARY]
          description: >
            The layout of the first members sheet, or of the first sheet when
            the file carried none. Use `sheets[].layout` for a workbook.
        totalRows: { type: number }
        okCount: { type: number }
        warnCount: { type: number }
        errorCount: { type: number }
        duplicateCount: { type: number }
        invalidPhoneCount: { type: number }
        heldCount:
          type: number
          description: Error rows held (or, on a dry run, to be held) as import exceptions.
        existingCount:
          type: number
          description: Rows matching records already in the system, which the import would update.
        committedCount: { type: number }
        resolvedExceptions:
          type: array
          description: >
            Open exceptions fixed by this import. On a dry run, the exceptions
            that would be fixed, with memberId 0 and the restore counts those
            the snapshot holds.
          items:
            $ref: "#/components/schemas/ImportResolvedException"
        batches:
          type: array
          description: One import batch per company the commit touched. Empty on a dry run.
          items:
            $ref: "#/components/schemas/ImportBatchSummary"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowResult"
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/ImportSheetResult"
      required:
        [dryRun, layout, totalRows, okCount, warnCount, errorCount,
         duplicateCount, invalidPhoneCount, heldCount, existingCount, committedCount,
         resolvedExceptions, batches, rows, sheets]
    PolicyImportInput:
      type: object
      description: >
        Supply `sheets` (an uploaded workbook) or `csvText`. Only sheets in the
        Policies layout are read; any other sheet of the workbook is ignored.
      properties:
        csvText: { type: string }
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/ImportSheet"
        fileName:
          type: string
          description: The uploaded file's name, recorded in the audit trail.
        dryRun: { type: boolean }
        confirmUpdates:
          type: boolean
          description: >
            Required (true) to commit a file in which some members already have
            a policy, which the import would replace; otherwise the commit
            answers 409 UPDATES_NOT_CONFIRMED. Ignored on a dry run.
      required: [dryRun]
    PolicyImportLayout:
      type: object
      properties:
        label: { type: string }
        columns:
          type: array
          items: { type: string }
        description: { type: string }
      required: [label, columns, description]
    PolicyImportRow:
      type: object
      properties:
        sheet: { type: string }
        rowNumber: { type: number }
        status:
          type: string
          enum: [OK, WARN, ERROR]
          description: OK adds a policy, WARN replaces the member's policy, ERROR is skipped.
        message: { type: string }
        reasonCodes:
          type: array
          description: >
            Why an ERROR row is skipped — e.g. MISSING_POLICY_FIELD, INVALID_DATE,
            MEMBER_NOT_FOUND, AMBIGUOUS_MEMBER, COMPANY_INACTIVE, DUPLICATE_IN_FILE.
          items: { type: string }
        companyNumber: { type: ["string", "null"] }
        memberIdNumber: { type: ["string", "null"] }
        memberName: { type: ["string", "null"] }
        policyNumber: { type: ["string", "null"] }
        existingRecord:
          type: boolean
          description: The member already has a policy, which this row replaces.
        changedFields:
          type: array
          description: For a member with a policy, the columns this row would change; empty when it matches.
          items: { type: string }
      required:
        [sheet, rowNumber, status, message, reasonCodes, companyNumber, memberIdNumber,
         memberName, policyNumber, existingRecord, changedFields]
    PolicyImportCompany:
      type: object
      properties:
        companyNumber: { type: string }
        saved:
          type: boolean
          description: False when a write failed and nothing for this company was saved.
        created: { type: number }
        updated: { type: number }
        message: { type: ["string", "null"] }
      required: [companyNumber, saved, created, updated, message]
    PolicyImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        totalRows: { type: number }
        okCount:
          type: number
          description: Rows that add a policy.
        warnCount:
          type: number
          description: Rows that replace a member's policy.
        errorCount: { type: number }
        existingCount:
          type: number
          description: Rows whose member already has a policy.
        committedCount:
          type: number
          description: Policies added or replaced. 0 on a dry run.
        companies:
          type: array
          description: One entry per company the commit touched. Empty on a dry run.
          items:
            $ref: "#/components/schemas/PolicyImportCompany"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PolicyImportRow"
      required:
        [dryRun, totalRows, okCount, warnCount, errorCount, existingCount,
         committedCount, companies, rows]
    ImportExceptionItem:
      type: object
      description: One held record on HR's fix list. The raw snapshot is never returned.
      properties:
        exceptionId: { type: number }
        entityType: { type: ["string", "null"] }
        personName: { type: ["string", "null"] }
        memberIdentifier: { type: ["string", "null"] }
        reasonCodes:
          type: array
          items: { type: string }
        reason: { type: ["string", "null"] }
        requiredAction: { type: ["string", "null"] }
        source:
          type: string
          enum: [BULK_IMPORT, LEGACY_MIGRATION]
        sourceFile: { type: ["string", "null"] }
        originalFileName: { type: ["string", "null"] }
        sheetName: { type: ["string", "null"] }
        excelRow: { type: ["number", "null"] }
        createdAt: { type: ["string", "null"] }
        status:
          type: string
          enum: [OPEN, RESOLVED]
        resolvedAt: { type: ["string", "null"] }
        resolvedBy: { type: ["string", "null"] }
        resolvedMemberId: { type: ["number", "null"] }
        resolutionMethod:
          description: IMPORT — a corrected row loaded; MANUAL — marked resolved by hand. Null while open.
          oneOf:
            - type: string
              enum: [IMPORT, MANUAL]
            - type: "null"
        resolutionNote: { type: ["string", "null"] }
      required:
        [exceptionId, entityType, personName, memberIdentifier, reasonCodes,
         reason, requiredAction, source, sourceFile, originalFileName, sheetName,
         excelRow, createdAt, status, resolvedAt, resolvedBy, resolvedMemberId,
         resolutionMethod, resolutionNote]
    ResolveImportExceptionInput:
      type: object
      properties:
        note:
          type: string
          minLength: 3
          description: Why the record no longer needs an import (kept with the resolution)
      required: [note]
    ImportExceptionList:
      type: object
      properties:
        companyNumber: { type: string }
        openCount: { type: number }
        resolvedCount: { type: number }
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/ImportExceptionItem"
      required: [companyNumber, openCount, resolvedCount, exceptions]
    ClassItem:
      type: object
