      type: object
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        roleLabel:
          type: string
          description: e.g. "Super admin" for ROLE_PLATFORM_ADMIN
        companyScope:
          type: ["string", "null"]
          description: The one company of an HR administrator or client admin
        active: { type: boolean }
        createdAt: { type: string }
      required: [id, email, displayName, role, roleLabel, companyScope, active, createdAt]
    AdminUserCreate:
      type: object
      description: >
        HR administrators and client admins need `companyScope`; every other
        role has none. A client admin may create only ROLE_CLIENT_ADMIN or
        ROLE_HR_ADMIN users, for its own company (spec FR-018).
      properties:
        email: { type: string, minLength: 3 }
        displayName: { type: string, minLength: 2 }
        role:
          type: string
          enum: [ROLE_PLATFORM_ADMIN, ROLE_CLIENT_ADMIN, ROLE_HR_ADMIN, ROLE_SUPPORT, ROLE_AUDITOR]
        companyScope:
          type: ["string", "null"]
          description: Company number, for ROLE_HR_ADMIN and ROLE_CLIENT_ADMIN only
      required: [email, displayName, role, companyScope]
    AdminUserCreateResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUserSummary"
        temporaryPassword:
          type: string
          description: Shown once; the invitee should change it after first sign-in
      required: [user, temporaryPassword]
    AdminUserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 2 }
        role:
          type: string
          enum: [ROLE_PLATFORM_ADMIN, ROLE_CLIENT_ADMIN, ROLE_HR_ADMIN, ROLE_SUPPORT, ROLE_AUDITOR]
        companyScope:
          type: ["string", "null"]
          description: Company number, for ROLE_HR_ADMIN and ROLE_CLIENT_ADMIN only
        active: { type: boolean }
