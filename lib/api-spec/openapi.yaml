openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BHI Health Card Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: employee
  - name: adminAuth
  - name: adminMembers
  - name: adminOps
  - name: assistant
  - name: pos
    description: Partner point-of-sale integration, authenticated by a per-brand POS key.
paths:
  /v1/assistant/ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the Need help assistant a general portal question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantAskInput"
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswer"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/lookup:
    post:
      operationId: lookupMember
      tags: [employee]
      summary: Start a card lookup by email or phone
      description: >
        Searches every active company. A contact that matches no member is
        refused with 404 CONTACT_NOT_FOUND. Otherwise the response is the same
        — CODE_SENT, with the same shape and at least the same response time —
        whether the contact matches one member, several in one company, or
        members in several companies (spec FR-016). Choosing between several
        records, and the multi-company message, both happen after the code is
        verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupInput"
      responses:
        "200":
          description: Uniform lookup response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResult"
        "400":
          description: Invalid input (depends only on the input's format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: CONTACT_NOT_FOUND — no eligible member has this email or phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/otp/select:
    post:
      operationId: selectVerifiedRecord
      tags: [employee]
      summary: After verification, choose which of several records in one company is yours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSelectInput"
      responses:
        "200":
          description: The card session for the chosen record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResult"
        "400":
          description: The selection has expired or does not belong to this verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/otp/verify:
    post:
      operationId: verifyOtp
      tags: [employee]
      summary: Verify the 6-digit code and get a card session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: >
            Verified. `status` says what follows: CARD (a card session was
            issued), SELECT (choose one of several records in one company with
            /v1/otp/select), or MULTI_COMPANY (the contact matches members in
            more than one company; no card, contact HR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResult"
        "400":
          description: Wrong code, expired, or locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/otp/resend:
    post:
      operationId: resendOtp
      tags: [employee]
      summary: Resend the one-time code (60s cooldown, max 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpResendInput"
      responses:
        "200":
          description: Uniform lookup response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResult"
        "400":
          description: Cooldown or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/card:
    get:
      operationId: getCard
      tags: [employee]
      summary: Get the digital card for the current card session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayload"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/card/email:
    post:
      operationId: emailCard
      tags: [employee]
      summary: Email the card to the member as a PDF attachment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEmailResult"
        "400":
          description: No email address on file for this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: No active policy on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "503":
          description: Email delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/card/change-requests:
    post:
      operationId: createChangeRequest
      tags: [employee]
      summary: Raise a Request For Modification (RFM) for yourself or a dependant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestCreate"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnChangeRequest"
        "400":
          description: >
            No change requested, values match the record already, too many
            pending requests, or the document was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
    get:
      operationId: listOwnChangeRequests
      tags: [employee]
      summary: The requests raised by the current card session's member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The member's own requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnChangeRequest"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/session/logout:
    post:
      operationId: logoutCardSession
      tags: [employee]
      summary: Revoke the card session server-side
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /v1/discounts:
    get:
      operationId: getDiscounts
      tags: [employee]
      summary: The member's discount allowance this month, the partner brands, and their recent coupons
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Discount summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountSummary"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/discounts/coupons:
    get:
      operationId: listDiscountCoupons
      tags: [employee]
      summary: The member's coupons, newest first, filtered and paged
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: query
          schema: { $ref: "#/components/schemas/DiscountBrand" }
        - name: status
          in: query
          description: EXPIRED is an ACTIVE coupon past its expiry; ACTIVE excludes those.
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, REDEEMED, VOIDED, CANCELLED]
        - name: month
          in: query
          description: "Generated in this month, Guyana time: YYYY-MM"
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        - name: page
          in: query
          schema: { type: number, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: number, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: One page of coupons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnDiscountCouponPage"
        "400":
          description: An unknown brand or status, or a malformed month (INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
    post:
      operationId: generateDiscountCoupon
      tags: [employee]
      summary: Generate a single-use coupon for one brand, with the one-time code sent for it
      description: >
        Needs the one-time code from POST /v1/discounts/coupons/otp. The
        coupon code is returned once, here, and stored only as a hash.
        Generating a coupon cancels the member's previous unredeemed coupon for
        the same brand. Refused when nothing is left of this month's allowance.
        Wrong code: 400 OTP_INCORRECT (attempts left in the message); after
        three, 423 OTP_LOCKED. Also 400 OTP_EXPIRED, OTP_SUPERSEDED,
        OTP_NOT_FOUND.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCouponInput"
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCoupon"
        "400":
          description: Unknown brand (INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: This month's allowance is used up (ALLOWANCE_EXHAUSTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "423":
          description: Too many incorrect codes (OTP_LOCKED); ask for a new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/discounts/coupons/otp:
    post:
      operationId: requestCouponOtp
      tags: [employee]
      summary: Send the member a one-time code to confirm generating a coupon
      description: >
        Goes to the member's own email on file, else their phone. Only the
        newest code works; asking again retires the earlier one. One request
        a minute (429 OTP_TOO_SOON).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponOtpInput"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponOtpChallenge"
        "400":
          description: Unknown brand (INVALID_INPUT), or no email or phone on file (NO_CONTACT_ON_FILE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: This month's allowance is used up (ALLOWANCE_EXHAUSTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "429":
          description: Asked again within a minute (OTP_TOO_SOON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "503":
          description: The code could not be sent (OTP_DELIVERY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/pos/coupons/check:
    post:
      operationId: posCheckCoupon
      tags: [pos]
      summary: Validate a scanned coupon and, given a bill, quote its discount. Changes nothing.
      security:
        - posKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosCheckInput"
      responses:
        "200":
          description: The coupon can be redeemed now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosCheckResult"
        "400":
          description: Malformed request (INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing or unknown POS key (POS_UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: No such coupon (COUPON_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: >
            Cannot be redeemed: COUPON_WRONG_BRAND, COUPON_EXPIRED,
            COUPON_ALREADY_REDEEMED, COUPON_VOIDED, COUPON_CANCELLED,
            MEMBER_NOT_ELIGIBLE or ALLOWANCE_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/pos/coupons/redeem:
    post:
      operationId: posRedeemCoupon
      tags: [pos]
      summary: Redeem a coupon against a bill and record the discount given
      description: >
        Single-use. Retrying with the same code and posReference returns the
        original redemption rather than an error, so a till that lost the
        response can safely send it again.
      security:
        - posKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosRedeemInput"
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRedemption"
        "400":
          description: Malformed request (INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing or unknown POS key (POS_UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: No such coupon (COUPON_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: >
            Cannot be redeemed — the same codes as /v1/pos/coupons/check — or
            PARTIAL_DISCOUNT_NOT_CONFIRMED: the allowance covers less than the
            full percentage and confirmPartialDiscount was not sent. That
            answer also carries `quote` beside `error`; nothing is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/pos/coupons/{couponId}/void:
    post:
      operationId: posVoidCoupon
      tags: [pos]
      summary: Reverse a redemption (sale cancelled or refunded) and give the allowance back
      security:
        - posKey: []
      parameters:
        - name: couponId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosVoidInput"
      responses:
        "200":
          description: Voided (also returned when it was already voided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosVoidResult"
        "400":
          description: Malformed request (INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "401":
          description: Missing or unknown POS key (POS_UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: No redemption with this id for this brand (COUPON_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: Never redeemed, so there is nothing to void (COUPON_NOT_REDEEMED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [adminAuth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [adminAuth]
      summary: Current admin identity, scope, and permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [adminOps]
      summary: Dashboard summary within the admin's scope
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/companies:
    get:
      operationId: listCompanies
      tags: [adminMembers]
      summary: Companies in the admin's scope (for filters and pickers)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
    post:
      operationId: onboardCompany
      tags: [adminOps]
      summary: >
        Onboard a client company and issue its one client admin login (super
        admin; all-or-nothing, no code release — spec FR-017)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyOnboard"
      responses:
        "201":
          description: The company, its client admin, and the admin's temporary password (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOnboardResult"
        "400":
          description: Validation failed (a value too long, a bad email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: COMPANY_EXISTS or EMAIL_IN_USE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/companies/{companyNumber}:
    patch:
      operationId: updateCompany
      tags: [adminOps]
      summary: >
        Edit a company's profile (super admin: every field; client admin:
        address and contact fields of its own company)
      security:
        - bearerAuth: []
      parameters:
        - name: companyNumber
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: The updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Not found or out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/companies/{companyNumber}/offboard:
    post:
      operationId: offboardCompany
      tags: [adminOps]
      summary: >
        Offboard a company (super admin): it becomes inactive, its users are
        deactivated, and it leaves the card lookup and billing. No record is
        deleted (spec FR-019).
      security:
        - bearerAuth: []
      parameters:
        - name: companyNumber
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: The offboarded company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Already inactive, or no reason given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/companies/{companyNumber}/reactivate:
    post:
      operationId: reactivateCompany
      tags: [adminOps]
      summary: Bring an offboarded company back, with its users (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: companyNumber
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: The reactivated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Already active, or no reason given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /v1/admin/members:
    get:
      operationId: listMembers
      tags: [adminMembers]
      summary: Search members across the admin's scope (paged, masked per role)
      description: >
        Covers every company the caller's scope reaches — one company for a
        client admin or HR administrator, every company for a super admin,
        support or auditor — and labels each row with its company.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Matches first or last name, ID number, email or phone
          schema: { type: string }
        - name: company
          in: query
          description: Narrow to one company number within the scope
          schema: { type: string }
        - name: active
          in: query
          description: true for active members, false for inactive; omit for both
          schema: { type: string, enum: ["true", "false"] }
