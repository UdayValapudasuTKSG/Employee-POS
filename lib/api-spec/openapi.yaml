        tiers:
          type: array
          description: Exactly four, one per band
          items:
            $ref: "#/components/schemas/RateTierInput"
        notes: { type: ["string", "null"] }
        reason: { type: string, minLength: 3 }
      required: [classCode, effectiveDate, tiers, reason]
    UpdateRateInput:
      type: object
