# BHI Health Card Portal — nginx site config, HTTPS.
#
# Swap this in AFTER a certificate exists. nginx will not start if
# ssl_certificate points at a file that is not there, so obtain the cert with
# bhi-portal.conf in place first:
#
#   sudo certbot certonly --webroot -w /var/www/html -d CHANGE_ME.example.com
#   sudo cp nginx/bhi-portal-ssl.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/bhi-portal-ssl.conf /etc/nginx/sites-enabled/bhi-portal.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace CHANGE_ME.example.com everywhere below — it appears in the two
# server_name lines and in the three certificate paths.
#
# `certbot --nginx` can rewrite bhi-portal.conf for you instead of this file
# being used at all. This exists because that rewrite produces a config nobody
# reviewed, and because HSTS, OCSP stapling and the cipher policy below are not
# things it adds.

# ---------------------------------------------------------------------------
# Port 80: renewals and a redirect. Nothing else is served here.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the portal.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CHANGE_ME.example.com;

    root /var/www/bhi-portal;
    index index.html;

    server_tokens off;

    # This portal's own log files, in the bhi_portal format from
    # bhi-portal-limits.conf. Separate from the shared /var/log/nginx/access.log
    # so a search is not competing with every other site on the machine, and so
    # the error log below holds only this portal's failures — which is where a
    # 502 or a 504 is explained, since neither reaches the API to be logged there.
    access_log /var/log/nginx/bhi-portal.access.log bhi_portal;
    error_log  /var/log/nginx/bhi-portal.error.log warn;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;

    # TLS 1.2 is kept for older Android handsets, which matter for a portal
    # members open on their phones. Everything below 1.2 is off.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling saves each visitor a round trip to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/CHANGE_ME.example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS. Deliberately without `preload` and without includeSubDomains:
    # both are hard to undo, and preload in particular is a months-long removal
    # process if this domain ever needs to serve something on plain HTTP. Add
    # them once you are sure.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    limit_conn bhi_conn 20;

    # Renewals continue to work after the switch.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # --- rate-limited endpoints --------------------------------------------
    location = /api/v1/lookup {
        limit_req zone=bhi_lookup burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /api/v1/admin/auth/login {
        limit_req zone=bhi_adminlogin burst=2 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # --- everything else under /api -----------------------------------------
    # No trailing slash on proxy_pass: the API mounts its router at /api and the
    # prefix must arrive intact.
    location /api/ {
        limit_req zone=bhi_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Matches the API's own 12mb limit on the import and change-request
        # routes. Keep the two equal — see bhi-portal.conf for why.
        client_max_body_size 12m;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
    }
}
