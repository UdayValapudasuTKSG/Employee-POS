# Security headers, as a snippet rather than a server-level block.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp nginx/bhi-portal-headers.conf /etc/nginx/snippets/
#
# WHY A SNIPPET: nginx's add_header does not merge across levels. A location
# block containing even one add_header of its own discards every add_header
# inherited from the server block. Both /assets/ and / set a Cache-Control
# header, so declaring these once at server level would silently leave the
# actual HTML and asset responses unprotected. Including the same snippet in
# each location is the only arrangement where all of them arrive.
#
# The member card screens show names, dates of birth, policy numbers and
# employer, so these are not decorative.

# No framing at all: nothing here is ever meant to be embedded.
add_header X-Frame-Options "DENY" always;

# Stops a browser from second-guessing a Content-Type — the vector that turns
# an uploaded document served back verbatim into script.
add_header X-Content-Type-Options "nosniff" always;

# Do not leak the member's URL (which can carry a member id) to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The portal needs none of these.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Scripts are same-origin only; the build emits no inline script. Styles need
# 'unsafe-inline' because the UI sets style attributes on elements.
#
# The two fonts.* hosts are there because index.html loads Inter from Google
# Fonts. Remove them and the portal renders in a fallback font — nothing breaks,
# but it looks wrong. Worth knowing for a health portal: every visitor's browser
# announces itself to Google to fetch that stylesheet. Self-hosting the font
# (download the woff2 into client/assets, restyle the @font-face) removes the
# third party and lets both hosts come out of this line.
#
# If you later add an analytics tag or another CDN, this header is what will
# block it — name that host here rather than deleting the line.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
