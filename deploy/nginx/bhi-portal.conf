# BHI Health Card Portal — nginx site config, PLAIN HTTP.
#
# This is the bootstrap config. Its job is to serve the portal on port 80 long
# enough for certbot to prove you own the domain and issue a certificate. Then
# switch to bhi-portal-ssl.conf — admin session tokens travel in an
# Authorization header and are readable in transit on plain HTTP.
#
#   sudo cp nginx/bhi-portal-limits.conf   /etc/nginx/conf.d/
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp nginx/bhi-portal-headers.conf  /etc/nginx/snippets/
#   [ -f /etc/nginx/proxy_params ] || sudo cp nginx/proxy_params /etc/nginx/
#   sudo cp nginx/bhi-portal.conf          /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/bhi-portal.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace CHANGE_ME.example.com below with your domain first.

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.com;

    # Static React build (client/ from the release, copied here).
    root /var/www/bhi-portal;
    index index.html;

    # Do not advertise the exact nginx version in error pages and headers.
    server_tokens off;

    # This portal's own log files, in the bhi_portal format from
    # bhi-portal-limits.conf. Separate from the shared /var/log/nginx/access.log
    # so a search is not competing with every other site on the machine, and so
    # the error log below holds only this portal's failures — which is where a
    # 502 or a 504 is explained, since neither reaches the API to be logged there.
    access_log /var/log/nginx/bhi-portal.access.log bhi_portal;
    error_log  /var/log/nginx/bhi-portal.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No more than 20 simultaneous connections from one address.
    limit_conn bhi_conn 20;

    # Let certbot answer the ACME challenge unauthenticated. Present in the TLS
    # config too, so renewals keep working after the switch.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # --- rate-limited endpoints -------------------------------------------
    # Declared before the general /api/ block. nginx prefers the most specific
    # match and `location =` is exact, so these win.

    # Lookup reveals whether an email or phone belongs to an employee. The app
    # limits attempts per session, but nothing stops an attacker opening new
    # sessions, so the ceiling has to be per-IP and out here.
    location = /api/v1/lookup {
        limit_req zone=bhi_lookup burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
    }

    # Admin password brute force.
    location = /api/v1/admin/auth/login {
        limit_req zone=bhi_adminlogin burst=2 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;
    }

    # --- everything else under /api ----------------------------------------
    # NOTE: no trailing slash on proxy_pass. The API mounts its router at /api
    # (app.use("/api", router)), so the prefix must be forwarded intact. Add a
    # slash and nginx strips it, and every route 404s.
    location /api/ {
        limit_req zone=bhi_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        include /etc/nginx/snippets/bhi-portal-headers.conf;

        # A bulk import posts the whole workbook as one JSON body, and an
        # employee change request carries its supporting document inline as
        # base64. nginx defaults to 1m, which 413s both.
        #
        # Matched to the API's own 12mb limit on those two routes. Keep them
        # equal: set this lower and nginx rejects the request first, with a bare
        # HTML 413 instead of the API's explanatory JSON error.
        client_max_body_size 12m;

        # Card PDFs stream out of the API; buffering them to disk first adds
        # latency for no gain.
        proxy_buffering off;
    }

    # Fingerprinted build assets never change contents; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/bhi-portal-headers.conf;
        try_files $uri =404;
    }

    # Nothing legitimate is served from a dotfile.
    location ~ /\. {
        deny all;
    }

    # SPA fallback — every other path renders the React shell, which then routes
    # client-side. Without this, refreshing /admin/members returns 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/bhi-portal-headers.conf;
    }
}
