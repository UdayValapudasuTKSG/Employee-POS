# Rate-limit zones and the access log format for the BHI portal.
#
#   sudo cp nginx/bhi-portal-limits.conf /etc/nginx/conf.d/
#
# Everything here has to live in conf.d (which nginx includes inside http{})
# rather than in the site file: limit_req_zone and log_format are only valid at
# http level, and nginx refuses to start if either appears inside a server block.
#
# This file and the site config are a pair — the site config names the zones and
# the log format defined here, so copying one without the other makes nginx fail
# to start. `sudo nginx -t` says which name is missing.
#
# 10m of shared memory holds roughly 160,000 addresses, far more than this
# portal will ever see at once.

# Lookup reveals whether an email or phone belongs to an employee. The app
# limits attempts per verification session, but nothing stops an attacker
# opening new sessions, so the ceiling has to be per-IP and outside the app.
limit_req_zone $binary_remote_addr zone=bhi_lookup:10m      rate=10r/m;

# Admin password brute force.
limit_req_zone $binary_remote_addr zone=bhi_adminlogin:10m  rate=5r/m;

# Everything else under /api. Generous — a single admin screen can fire several
# requests at once — but it caps a scripted crawl of the member list.
limit_req_zone $binary_remote_addr zone=bhi_api:10m         rate=120r/m;

# Concurrent connections per address, which rate limits alone do not bound: a
# handful of slow uploads held open is a cheaper denial of service than a fast
# flood.
limit_conn_zone $binary_remote_addr zone=bhi_conn:10m;

# Return JSON-ish 429s rather than nginx's HTML page, and log the rejection at
# a level that shows up without turning on debug logging.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# Access log format
#
# The combined format nginx ships with omits the three things that matter when
# the portal is misbehaving:
#
#   $request_id           the reference the API logs and prints in its error
#                         messages, so one string finds this line and the API's
#                         own entries for the same request (see proxy_params);
#   $upstream_status      what the API answered, as opposed to what the client
#                         got. When they differ, nginx substituted the response —
#                         a 502 with an empty upstream_status is the API being
#                         unreachable, and a 504 is it being too slow;
#   $upstream_response_time
#                         where the time went. $request_time includes the client;
#                         this does not, so the two together separate a slow
#                         member's phone from a slow query.
#
# Referrer and user-agent are dropped: nothing here is diagnosed with them and
# both are attacker-controlled strings that end up in a file people read.
log_format bhi_portal '$remote_addr $request_id "$request" '
                      '$status upstream=$upstream_status '
                      'rt=$request_time urt=$upstream_response_time '
                      'len=$body_bytes_sent';
